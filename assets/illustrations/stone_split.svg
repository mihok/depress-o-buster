    <ellipse cx="120" cy="104" rx="24" ry="4.8" fill="none" stroke="#8E9BC7" stroke-width="1.75" stroke-opacity="0.4"/>
    <path d="M 101.4 93.6 C 101.4 86.0, 110.6 81.3, 121.3 81.6 C 132.1 82.0, 138.7 87.1, 138.6 94.3 C 138.4 100.8, 131.5 104.0, 120.3 104.0 C 109.4 104.0, 101.4 100.8, 101.4 93.6 Z" fill="#8FB39A"/>
  </g>
  <g opacity="0.65">
    <ellipse cx="190" cy="104" rx="22" ry="4.4" fill="none" stroke="#8E9BC7" stroke-width="1.5" stroke-opacity="0.4"/>
    <path d="M 172.7 94.3 C 172.7 87.3, 181.2 82.8, 191.2 83.2 C 201.2 83.5, 207.5 88.3, 207.3 95.0 C 207.1 101.0, 200.7 104.0, 190.2 104.0 C 180.1 104.0, 172.7 101.0, 172.7 94.3 Z" fill="#8FB39A"/>
