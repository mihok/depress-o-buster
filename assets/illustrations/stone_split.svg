<?xml version="1.0" encoding="UTF-8"?>
<!-- "Break this down smaller": one stone held above, three pebbles resting in the water below it. Smaller is still a step. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160">
  <!-- The stone from the brand mark, scaled 0.165, held in the upper half with no ring: it is not in the water yet -->
  <path d="M 85.2 48.5 C 85.2 34.3, 102.3 25.4, 122.5 26.1 C 142.6 26.8, 155.1 36.3, 154.8 49.8 C 154.5 62.1, 141.6 68.0, 120.5 68.0 C 100.0 68.0, 85.2 62.1, 85.2 48.5 Z" fill="#8FB39A"/>
  <ellipse cx="113.2" cy="39" rx="19.5" ry="7.3" fill="#FFFFFF" fill-opacity="0.14" transform="rotate(-8 113.2 39)"/>
  <!-- Three pebbles, the same stone at 0.095, 0.088 and 0.082, each in its own faint ring; group opacity so each pebble hides its ring -->
  <g>
    <ellipse cx="50" cy="104" rx="26" ry="5.2" fill="none" stroke="#8E9BC7" stroke-width="2" stroke-opacity="0.35"/>
    <path d="M 30.0 92.8 C 30.0 84.6, 39.8 79.5, 51.4 79.9 C 63.0 80.3, 70.2 85.8, 70.0 93.6 C 69.9 100.6, 62.4 104.0, 50.3 104.0 C 38.5 104.0, 30.0 100.6, 30.0 92.8 Z" fill="#8FB39A"/>
