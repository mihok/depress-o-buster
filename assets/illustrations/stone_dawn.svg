<?xml version="1.0" encoding="UTF-8"?>
<!-- Start tab after quiet days: the same stone as stone_still.svg, with soft light low on the horizon behind it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160">
  <defs>
    <!-- Dawn glow: ink at the water line fading to nothing, so the light has no edge -->
    <radialGradient id="dawn" gradientUnits="userSpaceOnUse" cx="110" cy="104" r="84">
      <stop offset="0" stop-color="#E6E8EA" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#E6E8EA" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#E6E8EA" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <path d="M 26 104 A 84 84 0 0 1 194 104 Z" fill="url(#dawn)"/>
  <line x1="24" y1="104" x2="216" y2="104" stroke="#8E9BC7" stroke-width="1.5" stroke-opacity="0.35" stroke-linecap="round"/>
  <ellipse cx="110" cy="104" rx="58" ry="13" fill="none" stroke="#8E9BC7" stroke-width="2" stroke-opacity="0.35"/>
  <!-- The stone from stone_still.svg, unchanged, drawn last so it hides the back of the ring -->
  <path d="M 70 82 C 70 65.5, 89.5 55, 112.5 56 C 135.5 57, 150 67.5, 149.5 83 C 149 97, 134.5 104, 110.5 104 C 87 104, 70 97, 70 82 Z" fill="#8FB39A"/>
  <!-- Light lying on the water -->
  <line x1="44" y1="123" x2="176" y2="123" stroke="#E6E8EA" stroke-width="3" stroke-opacity="0.18" stroke-linecap="round"/>
  <line x1="66" y1="132" x2="154" y2="132" stroke="#E6E8EA" stroke-width="2.5" stroke-opacity="0.12" stroke-linecap="round"/>
</svg>
