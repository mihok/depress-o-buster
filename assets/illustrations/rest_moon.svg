<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160">
  <!-- Running rest: a thin crescent over still water, nothing to approach -->
  <g transform="translate(136 50) rotate(-14)">
    <!-- One path: the outer arc of a 22 px disc, back along a second disc shifted 5 px -->
    <path d="M -2.5 -21.86 A 22 22 0 1 1 -2.5 21.86 A 22 22 0 0 0 -2.5 -21.86 Z" fill="#8E9BC7"/>
  </g>
  <!-- The water line -->
  <line x1="44" y1="104" x2="204" y2="104" stroke="#8E9BC7" stroke-width="1.5" stroke-opacity="0.35" stroke-linecap="round"/>
  <!-- The moon lying on the water: one soft band that tapers to nothing -->
  <ellipse cx="143" cy="119" rx="26" ry="1.8" fill="#8E9BC7" fill-opacity="0.2"/>
</svg>
