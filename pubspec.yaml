name: depress_o_buster
description: "An inverted-Pomodoro app for getting unstuck: approach a task for a tiny interval, then rest. Local-first, no account."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.4.3

  # Local database (SQLite via drift; sqlite3 3.x ships the native library as a Dart native asset)
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6

  # Alarms and background notifications
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2

  # In-app sounds and haptics
  audioplayers: ^6.8.1

  # Settings and secrets
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0

  # Claude-backed task breakdown (raw HTTPS, structured JSON output)
  http: ^1.6.0

  # Utilities
  uuid: ^4.6.0
  intl: ^0.20.3
  clock: ^1.1.3
  wakelock_plus: ^1.8.1
  meta: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
