name: depress_o_buster
description: "An inverted-Pomodoro app for getting unstuck: approach a task for a tiny interval, then rest. Local-first, no account."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.4.3

  # Local database (SQLite via drift; sqlite3 3.x ships the native library as a Dart native asset)
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6

  # Alarms and background notifications
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2

  # In-app sounds and haptics
  audioplayers: ^6.8.1

  # Settings and secrets
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0

  # Claude-backed task breakdown (raw HTTPS, structured JSON output)
  http: ^1.6.0

  # Utilities
  uuid: ^4.6.0
  intl: ^0.20.3
  clock: ^1.1.3
  wakelock_plus: ^1.8.1
  meta: ^1.19.0
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/illustrations/
    - assets/brand/mark.png

# App icons on every platform, generated from the painted pebble
# (assets/images/pebble.png via tool/brand/apply_icon.py) with
# `dart run flutter_launcher_icons`. See docs/VISUALS.md.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/mark.png
  min_sdk_android: 24
  adaptive_icon_background: "#F4F3EF"
  adaptive_icon_foreground: assets/brand/mark_foreground.png
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: assets/brand/mark_mono.png
  remove_alpha_ios: true
  background_color_ios: "#F4F3EF"
  image_path_ios_dark_transparent: assets/brand/mark_transparent.png
  image_path_ios_tinted_grayscale: assets/brand/mark_transparent.png
  desaturate_tinted_to_grayscale_ios: true
  web:
    generate: true
    image_path: assets/brand/mark.png
    background_color: "#0F1114"
    theme_color: "#0F1114"
  macos:
    generate: true
    image_path: assets/brand/mark.png

# Native splash screens, generated with `dart run flutter_native_splash:create`.
# The mark on the theme background, dark and light, including Android 12+.
flutter_native_splash:
  color: "#F4F3EF"
  color_dark: "#0F1114"
  image: assets/brand/splash_mark.png
  image_dark: assets/brand/splash_mark.png
  android_12:
    color: "#F4F3EF"
    color_dark: "#0F1114"
    image: assets/brand/splash_android12.png
    image_dark: assets/brand/splash_android12.png
  web: false
