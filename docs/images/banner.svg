<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Depress-o-buster: approach a task for a tiny interval, then rest.">
  <rect width="1200" height="360" rx="24" fill="#0F1114"/>
  <!-- the mark: one stone in still water -->
  <g transform="translate(150 180) scale(0.26) translate(-512 -512)">
    <ellipse cx="512" cy="588" rx="300" ry="64" fill="none" stroke="#8E9BC7" stroke-width="18" stroke-opacity="0.62"/>
    <ellipse cx="512" cy="600" rx="420" ry="96" fill="none" stroke="#8E9BC7" stroke-width="14" stroke-opacity="0.3"/>
    <path d="M 300 478 C 300 392, 404 338, 526 342 C 648 346, 724 404, 722 486 C 720 560, 642 596, 514 596 C 390 596, 300 560, 300 478 Z" fill="#8FB39A"/>
    <ellipse cx="470" cy="420" rx="118" ry="44" fill="#E6E8EA" fill-opacity="0.14" transform="rotate(-8 470 420)"/>
  </g>
  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#E6E8EA">
    <text x="330" y="168" font-size="64" font-weight="300" letter-spacing="-1">Depress-o-buster</text>
    <text x="332" y="222" font-size="26" fill="#9AA3AB">Approach a task for a tiny interval, then rest.</text>
    <text x="332" y="262" font-size="26" fill="#9AA3AB">Small steps, no guilt. Local-first, no account.</text>
  </g>
  <line x1="332" y1="300" x2="1060" y2="300" stroke="#8E9BC7" stroke-opacity="0.35" stroke-width="1.5" stroke-linecap="round"/>
</svg>
